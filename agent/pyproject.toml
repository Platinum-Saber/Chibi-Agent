[project]
name = "chibi-agent"
version = "0.1.1"
description = "Raphael's agent process: orchestrator, tools, memory, IPC hub"
requires-python = "==3.12.*"
dependencies = [
    "chibi-shared",
    "httpx>=0.27",
    "websockets>=13",
    "pynput>=1.7",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.615.71",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pywin32>=312",
    "pycaw>=20260927",
    "comtypes>=1.4.17",
    "sqlite-vec>=0.1.9",
    "dateparser>=1.4.3",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "winrt-runtime>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-ui-notifications>=3.2.1",
    "winrt-windows-ui-notifications-management>=3.2.1",
    "winrt-windows-applicationmodel>=3.2.1",
]

[tool.uv.sources]
chibi-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
