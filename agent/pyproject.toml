[project]
name = "chibi-agent"
version = "0.1.0"
description = "Raphael's agent process: orchestrator, tools, memory, IPC hub"
requires-python = "==3.12.*"
dependencies = ["chibi-shared", "httpx>=0.27", "websockets>=13", "pynput>=1.7"]

[tool.uv.sources]
chibi-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
