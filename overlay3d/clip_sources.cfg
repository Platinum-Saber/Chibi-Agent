; Which Mixamo clips (overlay3d/anims/mixamo/, out of git) play each clips.gd slot.
; files: one or more; with several, a random one plays each time the slot starts or loops.
; start / end: trim in seconds (end 0 = to the end). loop: overrides clips.gd LOOPING.
; lift: raise the take by metres (lying and sitting takes can sink into the floor).
; keep_height: ignore the take's own hip height (her hips stay at standing height, minus -lift).
; vary: false keeps one take for the whole time in the slot (default: a new take each loop).
; per_file: settings for one file, over the slot's: per_file={"x.fbx": {"lift": 0.1}}
; blanket: the futon blanket for that take, 1 raised over her (default), 0 flat under her.
; Fall stays keyed: the Mixamo falls are stumbles, not a body in the air.
; A slot missing here, or whose files are all missing, plays its keyed clip (clips.gd).

[Idle]
files=["Idle-breathing.fbx", "weight shift.fbx"]

[Talk]
files=["Talking-normal.fbx", "happy hand gesture.fbx", "acknowledging.fbx", "lengthy head nod.fbx", "head nod yes.fbx"]

[Think]
files=["Thinking.fbx", "thoughtful head shake.fbx"]

[Analyse]
files=["Pointing.fbx"]

[Notice]
files=["Hand Raising.fbx"]

[Happy]
files=["Happy.fbx"]

[Surprised]
files=["Reacting-surprise.fbx"]

[Pout]
files=["Angry.fbx", "annoyed head shake.fbx"]

[Upset]
files=["Crying.fbx"]

[Held]
files=["Hanging Idle.fbx"]

[Carried]
; plays once and holds the end pose (carried flat); hips near knee height, by the cursor
files=["Being Carried.fbx"]
keep_height=true
lift=-0.35
loop=false

[Land]
files=["Falling To Landing.fbx"]

; Dropped while Carried (stage.py fall_flat): FallFlat in the air, FlatImpact on the floor, then
; GetUp. The brain's HARD_LANDING_MS covers impact + getting up; stage.py FLAT_IMPACT_S splits them.
[FallFlat]
files=["Falling-facedown.fbx"]

[FlatImpact]
; from touchdown at 0.4 s (before that she's still in the air); lift: she sank ~3 cm into the floor
files=["Falling Flat Impact.fbx"]
start=0.4
lift=0.03
loop=false

[GetUp]
; the end of the jump-down landing: from all fours (1.4 s) to standing
files=["Hard Landing.fbx"]
start=1.4
loop=false

[Dizzy]
files=["Dizzy Idle.fbx"]

[Walk]
files=["Walking.fbx"]

[Sleep]
; one take per sleep, on the floor (the futon is off for now: props.gd SHOW_FUTON). Laying Pose:
; on her front; Laying Pose - 2: propped up on one arm; Sleeping Idle: on her side. With the
; futon on, their lifts were 0.12 / 0.14 / 0.25 (on the mattress) and Sleeping Idle lay on top
; of a flat blanket (`blanket`, ignored without the futon).
files=["Female Laying Pose.fbx", "Female Laying Pose - 2.fbx", "Sleeping Idle.fbx"]
vary=false
per_file={"Female Laying Pose.fbx": {"lift": 0.0}, "Female Laying Pose - 2.fbx": {"lift": 0.0}, "Sleeping Idle.fbx": {"lift": 0.05, "blanket": 0.0}}

[Sit]
; on her slime beanbag (props.gd): the chair take, hips held at the squashed seat (~0.37 m)
files=["Sitting Idle.fbx"]
keep_height=true
lift=-0.415

[DanceVibe]
files=["Listening To Music.fbx"]

[DanceExcited]
files=["Snake Hip Hop Dance.fbx"]

[LookAround]
files=["Looking Around.fbx"]

[Stretch]
files=["stretch.fbx", "Neck Stretching.fbx"]

[Wave]
files=["Waving.fbx"]
