# Chibi-Agent defaults. Override any key in %APPDATA%\ChibiAgent\config.toml.

[processes]
overlay = true
voice = true

[ollama]
url = "http://127.0.0.1:11434"
exe = '%LOCALAPPDATA%\Programs\Ollama\ollama.exe'
models_dir = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\ollama'   # set for the child process only
start_if_down = true
model = "qwen3.5:4b"
embed_model = "nomic-embed-text"
num_ctx = 8192
temperature = 0.4        # qwen3.5 defaults to 1.0, which made tool choice erratic
keep_alive = "120s"

[voice]
hf_home = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\hf'
reference = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\voice\ref_06_clean.wav'   # variant B: noise-reduced + EQ (spikes/voice/tune_voice.py)
reference_text = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\voice\ref_06.txt'
speed = 0.90
nfe = 8
stt_model = "small.en"
# Kokoro preset voices (tray -> Customize Raphael -> Voice): kokoro-v1.0.onnx + voices-v1.0.bin
# from github.com/thewh1teagle/kokoro-onnx releases (model-files-v1.0). Runs on the CPU.
kokoro_dir = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\models\kokoro'

[hotkeys]
push_to_talk = "alt+1"
look_at_screen = "ctrl+alt+s"

[overlay]
# The outfit she wears (one of [overlay.outfits.*]); the agent can change it while she runs.
outfit = "casual_coat"  # her own robe rig is "robe"; was "aniya"
# Stay in the chibi form (no switch to serious while working/alerting); the HUD and
# confirm buttons then show beside the chibi. Off by default; on for now (Kryo, 2026-10-19).
chibi_only = true
# Extra fonts for her text panel (Electroharmonix), outside git; every .otf/.ttf here is loaded.
fonts_dir = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\fonts'
# Her bodies, one at a time (tray / Customize -> "Switch to 3D model" / "Switch to 2D art"):
# the outfit each one wears. The choice is remembered in her Customize settings.
bodies = { 2d = "casual_coat", 3d = "teen_3d" }
# Godot 4.7 for the 3D body (overlay3d/); it draws her under this overlay's window.
godot_exe = 'X:\Godot\Godot_v4.7.2-stable_win64.exe\Godot_v4.7.2-stable_win64.exe'
# Shared mood maps (relative to overlay/); an outfit may set its own chibi_map / serious_map.
chibi_map = 'rigs/haru.toml'
serious_map = 'rigs/mao.toml'

# One exported model per outfit and form (docs/character.md -> Outfits).
# Placeholders (Live2D samples) until her real rigs exist.
[overlay.outfits.robe]
# Testing her own chibi rig (runtime v21: physics, 9 expressions, 18 motions, readable face; 2026-10-19); Haru was:
# chibi_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\chibi\Haru.model3.json'
chibi_rig = 'D:\Character Design\output\runtime\chibi\robe\Raphael_chibi_robe_v21.model3.json'
chibi_map = 'rigs/raphael_chibi.toml'
serious_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\serious\Mao.model3.json'

[overlay.outfits.casual_coat]
# svg-rig branch: her chibi as Kryo's casual-coat image pack (chibi_overlay/sprites.py), not Live2D.
# Wear it with outfit = "casual_coat" above, or ask her to change outfit.
chibi_rig = 'sprites:D:\Character Design\output\assets\chibi\casual-coat\v01'
chibi_map = 'rigs/raphael_sprites.toml'
serious_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\serious\Mao.model3.json'

[overlay.outfits.teen_3d]
# Her full-size 3D model (Godot renderer, overlay3d/README.md). Personal use only: the VRM in
# overlay3d/models/ stays out of git. One form: both names point at the same body.
chibi_rig = 'godot:D:\Projects\Chibi-Agent-Project\Chibi-Agent\overlay3d'
chibi_map = 'rigs/raphael_3d.toml'
serious_rig = 'godot:D:\Projects\Chibi-Agent-Project\Chibi-Agent\overlay3d'
serious_map = 'rigs/raphael_3d.toml'

[overlay.outfits.teen_3d_ruby]
# The same 3D body with ruby-red eyes and 5 % darker skin (D:\Character Design ... ruby-red-v01,
# history 061; exported as raphael_teen_ruby_v01.vrm). Wear it from tray -> Outfit.
chibi_rig = 'godot:D:\Projects\Chibi-Agent-Project\Chibi-Agent\overlay3d#raphael_teen_ruby.vrm'
chibi_map = 'rigs/raphael_3d.toml'
serious_rig = 'godot:D:\Projects\Chibi-Agent-Project\Chibi-Agent\overlay3d#raphael_teen_ruby.vrm'
serious_map = 'rigs/raphael_3d.toml'

[overlay.outfits.aniya]
# Free ANIYA model by DG_studio: personal use only, no for-profit streaming, no
# redistribution. Working copy made by tools/prepare_aniya.py (outside git).
chibi_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\chibi\aniya\aniya.model3.json'
chibi_map = 'rigs/aniya_chibi.toml'
serious_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\serious\Mao.model3.json'

[overlay.outfits.coat]
# Stand-in: the two samples swapped, so a switch is easy to see.
chibi_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\serious\Mao.model3.json'
chibi_map = 'rigs/mao.toml'
serious_rig = 'D:\Projects\Chibi-Agent-Project\ChibiAgent\rigs\chibi\Haru.model3.json'
serious_map = 'rigs/haru.toml'

[tools]
# Folders file tools may read and change (no deleting in v1).
allowed_roots = ['~']
# Per-turn tool selection (agent/chibi_agent/tools/select.py): send only the top
# families for the request. select = false sends every tool, as before.
select = true
families = 3        # top families by embedding similarity
margin = 0.03       # plus any family this close to the last one picked
min_sim = 0.35      # below this the request is unclear: send every tool
sticky_turns = 2    # families of tools called in the last N turns stay in

[briefing]
# Morning briefing: the first start after morning_after, or at morning_at if she was already running.
morning_after = "06:00"
morning_at = "07:30"
# No unasked urgent-mail warnings between quiet_from and quiet_to (they wait for the briefing).
quiet_from = "23:00"
quiet_to = "07:00"
poll_minutes = 5

[notifications]
# Windows toasts (tray -> Allow notification access). Polled, because the change event needs
# package identity; one listing takes 6-9 s (Spike 4), so not more often than this.
poll_seconds = 60
# The model labels at most this many new toasts per poll; the rest get the rule labels.
max_labels_per_poll = 5
# Display names as Windows shows them. Mail apps are here because the mail watch covers mail.
ignore_apps = ["Flow.Launcher", "NVIDIA App", "Claude", "ChatGPT", "Snipping Tool", "Camera",
               "PowerToys (Preview)", "Notification Suggestions", "Outlook", "Mail", "Thunderbird"]
