[project]
name = "chibi-voice"
version = "0.1.1"
description = "Chibi-Agent voice process: push-to-talk STT, Kokoro / F5-TTS sentence queue, clip cache, lip RMS"
requires-python = "==3.12.*"
dependencies = [
    "chibi-shared",
    "faster-whisper",
    # Whisper's CUDA 12 libraries without torch (env.load_cuda_dlls)
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "sounddevice",
    "soundfile",
    "numpy",
    "nvidia-ml-py",
    "kokoro-onnx>=0.6.1",
]

[project.optional-dependencies]
# A voice of your own (docs/custom-voice.md): `uv sync --extra f5`; not shipped.
f5 = ["torch", "torchaudio", "f5-tts==1.1.22"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chibi-shared = { path = "../shared", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
