[project]
name = "chibi-voice"
version = "0.1.0"
description = "Chibi-Agent voice process: push-to-talk STT, F5-TTS sentence queue, clip cache, lip RMS"
requires-python = "==3.12.*"
dependencies = [
    "chibi-shared",
    "torch",
    "torchaudio",
    "f5-tts==1.1.22",
    "faster-whisper",
    "sounddevice",
    "soundfile",
    "numpy",
    "nvidia-ml-py",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chibi-shared = { path = "../shared", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
