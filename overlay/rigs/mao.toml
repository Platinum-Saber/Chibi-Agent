# Mood -> motion/expression map for the Mao sample (serious-form placeholder).
height_dip = 420

[moods]
idle     = { motion = "Idle" }
talking  = { expression = "exp_01" }
thinking = { motion = "TapBody", index = 0, expression = "exp_02" }
working  = { motion = "TapBody", index = 3, expression = "exp_02" }
alert    = { motion = "TapBody", index = 1, expression = "exp_04" }
happy    = { motion = "TapBody", index = 2, expression = "exp_05" }

[moments]
analyse = { motion = "TapBody", index = 3 }
