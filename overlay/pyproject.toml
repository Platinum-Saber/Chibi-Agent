[project]
name = "chibi-overlay"
version = "0.1.0"
description = "Raphael's body: the transparent Live2D overlay, her brain and physics"
requires-python = "==3.12.*"
dependencies = [
    "chibi-shared",
    "PySide6>=6.12",
    "live2d-py==1.0.0",
    "PyOpenGL>=3.1",
    "numpy>=2",
    "winrt-windows-media-control>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-runtime>=3.2.1",
]

[tool.uv.sources]
chibi-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
