[project]
name = "chibi-shared"
version = "0.1.0"
description = "Protocol, config and paths shared by the Chibi-Agent processes"
requires-python = "==3.12.*"
dependencies = ["pydantic>=2.8", "websockets>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
